experiment:
  name: vortex_deepgreen_mlt_vorticity_inviscid_smoke
  version: 0.1.0
  description: Fast vertical-vorticity inviscid smoke test for hyperMLT DeepGreen training.

datasets:
  primary:
    source: smr
    path: /private/tmp/hyperMLT_smoke_data
    pattern: mmaria_multilink_mmaria-norway_20240601
    stop_after_first_day: true
    filter:
      max_arrival_angle_deg: 70
      clustering_radius: 0.1
      clustering_min_samples: 20
      clustering_passes: 1
      max_abs_doppler_velocity: 70
      duplicate_space_threshold_m: 500
      duplicate_time_threshold_s: 1
      enable_doppler_clustering_filter: true
      enable_mean_wind_quality_filter: false
      mean_wind_residual_sigma: 3.5
      require_smr_like: true
      horizontal_support_sigma: 2.5
      support_core_fraction: 0.75
      vertical_support_sigma: 3.5
    selection:
      operations: []
      random_seed: 0
    validation:
      holdout_fraction: 0.05
      random_seed: 0
  auxiliary: []

domain:
  time:
    start_hour: 0
    duration_hours: 24
    padding_fraction: 0.125
  region:
    lon_center: 18
    lat_center: 69
    alt_center_km: 90
  normalization:
    mode: fixed
    lower_bounds: [0, 80000, -150000, -150000]
    upper_bounds: [86400, 100000, 150000, 150000]
    label: vortex_300x300x20km_dt24h

model:
  architecture: deepgreen
  network:
    parameterization:
      wind: direct
      output_scale: [10, 10, 1]
    backbone:
      activation: sin
      weight_init: HeNormal
    Encoder:
      width: 64
      depth: 4
      use_skip_connections: true
    Decoder:
      width: 64
      depth: 4
      use_skip_connections: true
    KernelFunction:
      type: matern52
      latent_dim: 12
      n_green_functions: 16
    SourceGenerator:
      width: 16
      depth: 3
      n_sources: 32

physics:
  formulation: vertical_vorticity_inviscid
  state: uvw
  residual_weights:
    data: 1.0
    div: 1.0e-6
    mom: 1.0e-6
    temp: 0.0
    srt: 0.0
  pde_sampling:
    method: random
    sample_count: 256

training:
  epochs: 2
  learning_rate: 5.0e-04
  optimizer: Adam
  random_seed: 1234
  validation:
    metric: doppler_rmse
  scheduling:
    type: fixed

output:
  root_dir: /private/tmp/hyperMLT_vorticity_inviscid_smoke_runs_repo
  write_plots: true
  verbose: true
